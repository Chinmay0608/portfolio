<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="100%" stop-color="#12151d"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a524"/>
      <stop offset="100%" stop-color="#f76b1c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b1f29" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>

  <!-- top-left badge icon: stacked layers mark -->
  <g transform="translate(70,64)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#1a1d26" stroke="#2a2f3b"/>
    <g transform="translate(14,16)">
      <path d="M14 0 L28 8 L14 16 L0 8 Z" fill="url(#amber)"/>
      <path d="M0 15 L14 23 L28 15" fill="none" stroke="url(#amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
      <path d="M0 22 L14 30 L28 22" fill="none" stroke="url(#amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
    </g>
  </g>

  <!-- Title -->
  <text x="70" y="200" font-family="'JetBrains Mono','Courier New',monospace" font-size="52" font-weight="700" fill="#f2f3f5">Distributed Order</text>
  <text x="70" y="256" font-family="'JetBrains Mono','Courier New',monospace" font-size="52" font-weight="700" fill="#f2f3f5">Processing System</text>

  <!-- Tagline -->
  <text x="70" y="300" font-family="'Inter','Segoe UI',sans-serif" font-size="20" fill="#8a8f9c">Redis Distributed Locking · Kafka Event Pipeline · Zero-Overselling Guarantee</text>

  <!-- Architecture diagram -->
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="15" fill="#c7cad1">

    <!-- connecting lines -->
    <line x1="230" y1="440" x2="410" y2="440" stroke="#3a3f4c" stroke-width="2"/>
    <line x1="530" y1="440" x2="710" y2="440" stroke="#3a3f4c" stroke-width="2"/>
    <line x1="830" y1="440" x2="1010" y2="440" stroke="#3a3f4c" stroke-width="2"/>

    <!-- animated pulse dots along the lines -->
    <circle r="4" fill="url(#amber)" filter="url(#glow)">
      <animateMotion dur="3s" repeatCount="indefinite" path="M230,440 L410,440"/>
    </circle>
    <circle r="4" fill="url(#amber)" filter="url(#glow)">
      <animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M530,440 L710,440"/>
    </circle>
    <circle r="4" fill="url(#amber)" filter="url(#glow)">
      <animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M830,440 L1010,440"/>
    </circle>

    <!-- Node 1: Order Service -->
    <rect x="70" y="405" width="160" height="70" rx="10" fill="#161922" stroke="#2f3542" stroke-width="1.5"/>
    <text x="150" y="435" text-anchor="middle" fill="#f2f3f5" font-weight="700">Order</text>
    <text x="150" y="458" text-anchor="middle" fill="#f2f3f5" font-weight="700">Service</text>

    <!-- Node 2: Redis Lock -->
    <rect x="410" y="405" width="120" height="70" rx="10" fill="#161922" stroke="#f5a524" stroke-width="1.5"/>
    <text x="470" y="435" text-anchor="middle" fill="#f5a524" font-weight="700">Redis</text>
    <text x="470" y="458" text-anchor="middle" fill="#f5a524" font-weight="700">Lock</text>

    <!-- Node 3: MongoDB -->
    <rect x="710" y="405" width="120" height="70" rx="10" fill="#161922" stroke="#2f3542" stroke-width="1.5"/>
    <text x="770" y="435" text-anchor="middle" fill="#f2f3f5" font-weight="700">Mongo</text>
    <text x="770" y="458" text-anchor="middle" fill="#f2f3f5" font-weight="700">DB</text>

    <!-- Node 4: Kafka -->
    <rect x="1010" y="405" width="120" height="70" rx="10" fill="#161922" stroke="#2f3542" stroke-width="1.5"/>
    <text x="1070" y="435" text-anchor="middle" fill="#f2f3f5" font-weight="700">Kafka</text>
    <text x="1070" y="458" text-anchor="middle" fill="#f2f3f5" font-weight="700">Pipeline</text>
  </g>

  <!-- bottom accent line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#amber)"/>
</svg>
