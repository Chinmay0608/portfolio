<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trao-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="trao-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a524"/>
      <stop offset="100%" stop-color="#f76b1c"/>
    </linearGradient>
    <linearGradient id="trao-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="trao-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="trao-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b1f29" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#trao-bg)"/>
  <rect width="1200" height="630" fill="url(#trao-grid)" opacity="0.45"/>

  <!-- Top-left icon: AI Sparkles / Core -->
  <g transform="translate(70,60)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#1a1d26" stroke="#2a2f3b"/>
    <g transform="translate(16,16)">
      <path d="M12 0 L15 9 L24 12 L15 15 L12 24 L9 15 L0 12 L9 9 Z" fill="url(#trao-amber)"/>
      <circle cx="20" cy="4" r="2.5" fill="#38bdf8"/>
      <circle cx="4" cy="20" r="2" fill="#f5a524"/>
    </g>
  </g>

  <!-- Title -->
  <text x="70" y="180" font-family="'JetBrains Mono','Courier New',monospace" font-size="52" font-weight="700" fill="#f2f3f5">AI Interview Prep Kit</text>
  <text x="70" y="234" font-family="'JetBrains Mono','Courier New',monospace" font-size="34" font-weight="600" fill="url(#trao-amber)">(trao)</text>

  <!-- Tagline -->
  <text x="70" y="280" font-family="'Inter','Segoe UI',sans-serif" font-size="20" fill="#94a3b8">12-Step LLM Pipeline (Groq + Gemini) · SSE Streaming · 238 Tests · 0 TS Errors</text>

  <!-- Architecture Flow -->
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="14" fill="#c7cad1">
    <!-- Connecting lines -->
    <line x1="240" y1="420" x2="380" y2="420" stroke="#3a3f4c" stroke-width="2"/>
    <line x1="560" y1="420" x2="690" y2="420" stroke="#3a3f4c" stroke-width="2"/>
    <line x1="870" y1="420" x2="1000" y2="420" stroke="#3a3f4c" stroke-width="2"/>

    <!-- Animated pulse dots -->
    <circle r="4" fill="url(#trao-amber)" filter="url(#trao-glow)">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M240,420 L380,420"/>
    </circle>
    <circle r="4" fill="url(#trao-cyan)" filter="url(#trao-glow)">
      <animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M560,420 L690,420"/>
    </circle>
    <circle r="4" fill="url(#trao-amber)" filter="url(#trao-glow)">
      <animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M870,420 L1000,420"/>
    </circle>

    <!-- Node 1: Job Description -->
    <rect x="70" y="380" width="170" height="80" rx="10" fill="#161922" stroke="#2f3542" stroke-width="1.5"/>
    <text x="155" y="415" text-anchor="middle" fill="#f2f3f5" font-weight="700">Job Description</text>
    <text x="155" y="440" text-anchor="middle" fill="#94a3b8" font-size="12">Next.js 15 Client</text>

    <!-- Node 2: 12-Step LLM Engine -->
    <rect x="380" y="380" width="180" height="80" rx="10" fill="#161922" stroke="#f5a524" stroke-width="1.5"/>
    <text x="470" y="415" text-anchor="middle" fill="#f5a524" font-weight="700">12-Step Pipeline</text>
    <text x="470" y="440" text-anchor="middle" fill="#f2f3f5" font-size="12">Groq + Gemini AI</text>

    <!-- Node 3: SSE Streaming -->
    <rect x="690" y="380" width="180" height="80" rx="10" fill="#161922" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="780" y="415" text-anchor="middle" fill="#38bdf8" font-weight="700">SSE Streaming</text>
    <text x="780" y="440" text-anchor="middle" fill="#f2f3f5" font-size="12">Optimistic Lock 409</text>

    <!-- Node 4: Prep Kit Output -->
    <rect x="1000" y="380" width="140" height="80" rx="10" fill="#161922" stroke="#2f3542" stroke-width="1.5"/>
    <text x="1070" y="415" text-anchor="middle" fill="#f2f3f5" font-weight="700">Prep Kit</text>
    <text x="1070" y="440" text-anchor="middle" fill="#94a3b8" font-size="12">MongoDB Store</text>
  </g>

  <!-- Metric Badges -->
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="13">
    <rect x="70" y="520" width="195" height="34" rx="6" fill="#181c26" stroke="#2f3542"/>
    <text x="167" y="542" text-anchor="middle" fill="#38bdf8">✓ 238 Passing Tests</text>

    <rect x="280" y="520" width="175" height="34" rx="6" fill="#181c26" stroke="#2f3542"/>
    <text x="367" y="542" text-anchor="middle" fill="#34d399">0 TypeScript Errors</text>

    <rect x="470" y="520" width="165" height="34" rx="6" fill="#181c26" stroke="#2f3542"/>
    <text x="552" y="542" text-anchor="middle" fill="#f5a524">3 Monorepo Packages</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#trao-amber)"/>
</svg>